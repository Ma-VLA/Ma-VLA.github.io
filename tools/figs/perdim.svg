<text class="vz-note" x="16" y="290" data-en="The action space is 32 wide and the robot has 7 dimensions. The 25 padding dimensions carry 0.92% of the reported loss — the real dimensions average 383 times more — so the padding is close to free and replacing the head with a native 7-dimensional one has almost nothing to recover." data-ko="액션 공간은 32차원이고 로봇은 7차원이다. 패딩 25차원이 보고된 loss의 0.92%를 차지하고 실제 차원은 평균 383배 크다 — 즉 패딩은 사실상 공짜이고, 헤드를 native 7차원으로 교체해도 되찾을 게 거의 없다.">The 25 padding dimensions carry 0.92% of the loss; the real dimensions average 383× more.</text>
<text class="vz-note" x="16" y="308" data-en="j5 is the largest single share at 25.7%, and it is the joint the arm holds mechanically fixed — the normalizer divides it by a range 13.4 times narrower than the other joints." data-ko="j5가 25.7%로 단독 최대인데, 이 관절은 팔이 기계적으로 고정하고 있는 관절이다 — 정규화가 다른 관절보다 13.4배 좁은 범위로 나눈다.">j5 is the largest single share at 25.7% — and it is the joint held mechanically fixed.</text>
</svg>