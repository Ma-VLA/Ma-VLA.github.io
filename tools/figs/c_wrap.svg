<text class="vz-note" x="16" y="290" data-en="The two histograms coincide: the correction rewrites only the wrapped frame and leaves every other delta bit-identical. q99 minus q01 moves 0.985 to 0.997 — one frame in 540 is 0.19%, inside the 1% tail, so the percentiles can never widen to cover it." data-ko="두 히스토그램이 겹친다 — 보정은 wrap 프레임 하나만 다시 쓰고 나머지 델타는 비트 단위로 동일하다. q99−q01 은 0.985→0.997로만 움직인다. 540 중 1프레임은 0.19%로 1% 꼬리 안쪽이라 백분위가 넓어질 수 없다.">The two histograms coincide — the correction rewrites only the wrapped frame. One frame in 540 is 0.19%, inside the 1% tail.</text>
