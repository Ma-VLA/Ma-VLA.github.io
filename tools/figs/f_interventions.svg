<text class="vz-note" x="16" y="230" data-en="Read as a direction, not a size: the question is whether the action moves along that episode’s own destination axis. A size test on the same data cannot tell these four apart." data-ko="크기가 아니라 방향으로 읽습니다 — 행동이 그 에피소드 자신의 목적지 축을 따라 움직이는가를 묻습니다. 같은 데이터에 크기 검정을 걸면 이 넷이 구분되지 않습니다.">Read as a direction, not a size — a size test cannot tell these four apart.</text>
