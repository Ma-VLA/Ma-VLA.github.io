<text class="vz-note" x="16" y="238" data-en="j5 is held near −88° by the arm geometry: it spans 2.0° across the whole dataset while the others span 35–72°. Its per-frame delta range is 0.245 against a median of 3.29." data-ko="j5는 팔 구조상 −88° 부근에 고정된다 — 전체 데이터셋에서 2.0°만 움직이는 동안 다른 관절은 35–72° 움직인다. 프레임당 델타 범위는 0.245로 중앙값 3.29 대비 13.4배 좁다.">j5 is held near −88° by the arm geometry — 2.0° across the whole dataset against 35–72° for the others.</text>
<text class="vz-note" x="16" y="256" data-en="This model normalizes by the percentile range, not by standard deviation, so that 0.245 is the divisor: whatever jitter remains in a joint that barely moves is stretched to fill the same ±1 the working joints get." data-ko="이 모델은 표준편차가 아니라 백분위 범위로 정규화하므로 0.245가 나누는 값이 된다 — 거의 안 움직이는 관절에 남은 지터가 실제로 일하는 관절과 똑같은 ±1로 펴진다.">The divisor is that 0.245 — jitter in a barely-moving joint is stretched to the same ±1 the working joints get.</text>
</svg>